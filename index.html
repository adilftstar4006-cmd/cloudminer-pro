<script>
(function(){
  window.__signupName=""; window.__userName="";
  // --- Inject Name input in Create Account form ---
  function injectName(){
    // Find signup form: inputs with placeholder Email address - the one inside auth page
    var inputs = Array.from(document.querySelectorAll('input[placeholder="Email address"]'));
    // Only inject once
    if(document.getElementById('cm-name-input')) return;
    var emailInput = inputs[0];
    if(!emailInput) return;
    // Check if we are in signup mode: button text Create Account exists and is active? We inject always, but hide in login mode via observer of tab
    // We will inject and toggle visibility based on Create Account button active state
    var wrap = emailInput.closest('div.relative');
    if(!wrap) return;
    var div = document.createElement('div');
    div.id='cm-name-wrap';
    div.className='relative group';
    div.innerHTML = '<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px">👤</span><input id="cm-name-input" placeholder="Full Name — e.g. Muhammad Adil" autocomplete="name" style="width:100%;height:46px;padding-left:40px;padding-right:12px;background:#0a0e13;border:1px solid #2a2e35;border-radius:12px;color:#fff;font-size:14px;outline:none" />';
    wrap.parentNode.insertBefore(div, wrap);
    var inp = document.getElementById('cm-name-input');
    inp.addEventListener('input', function(){ window.__signupName = this.value.trim(); try{localStorage.setItem('cm_signup_name', this.value)}catch(e){} });
    // Restore
    try{ var saved=localStorage.getItem('cm_signup_name'); if(saved){ inp.value=saved; window.__signupName=saved; } }catch(e){}
    // Also hook signup button: if signup and name empty, block and alert
    document.addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if(btn && btn.textContent && btn.textContent.trim()==='Create Account'){
        var nameVal = document.getElementById('cm-name-input') ? document.getElementById('cm-name-input').value.trim() : window.__signupName;
        if(!nameVal){
          // Only block if we are in signup mode (Confirm Password visible)
          var hasConfirm = !!Array.from(document.querySelectorAll('input[placeholder="Confirm Password"]')).length;
          if(hasConfirm){ e.preventDefault(); e.stopPropagation(); alert('Please enter your Full Name'); return false; }
        } else { window.__signupName=nameVal; }
      }
    }, true);
  }
  // Toggle name visibility: show only when Confirm Password exists (signup mode), hide in login mode
  function toggleName(){
    var wrap=document.getElementById('cm-name-wrap');
    if(!wrap) return;
    var isSignup = !!document.querySelector('input[placeholder="Confirm Password"]');
    wrap.style.display = isSignup ? 'block' : 'none';
  }
  // --- Load name from Firestore for profile ---
  async function loadName(){
    try{
      // Find uid + token from localStorage (app stores as cloudminer... or similar)
      var uid=null, token=null;
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); var v=localStorage.getItem(k)||""; try{ var j=JSON.parse(v); if(j && j.uid){ uid=j.uid; token=j.idToken||j.token||j.accessToken; } if(j && j.localId){ uid=j.localId; token=j.idToken; } }catch(e){} if(v && v.indexOf('cloudminer')!==-1){} }
      // Fallback: try to read from app's stored keys - check all keys for uid pattern
      if(!uid){
        var keys=Object.keys(localStorage);
        for(var k of keys){ try{ var vv=JSON.parse(localStorage.getItem(k)); if(vv && vv.uid) uid=vv.uid; }catch(e){} }
      }
      if(!uid) return;
      // Try Firestore REST via fetch with token if available, else without (rules allow if authenticated, but try public)
      var url='https://firestore.googleapis.com/v1/projects/cloudminer-pro/databases/(default)/documents/users/'+encodeURIComponent(uid)+'?key=AIzaSyBjpydjZr22BAL_XuCp3p9_UVqQbvDuI6g';
      var headers={};
      if(token) headers['Authorization']='Bearer '+token;
      var res=await fetch(url,{headers:headers});
      if(!res.ok) return;
      var data=await res.json();
      var fields=data.fields||{};
      var name = fields.name && fields.name.stringValue ? fields.name.stringValue : "";
      if(name){ window.__userName=name; try{localStorage.setItem('cm_display_name', name)}catch(e){} }
      // Also inject Name row + Edit in Profile page if visible
      injectProfileEdit(uid, token, name);
    }catch(e){}
  }
  function injectProfileEdit(uid, token, name){
    // Profile page: find "Verified Miner" element
    var verified = Array.from(document.querySelectorAll('div')).find(d=>d.textContent && d.textContent.trim()==='CloudMiner Member');
    if(!verified) return;
    if(document.getElementById('cm-profile-name-edit')) return;
    var card = verified.closest('div.rounded-\\[20px\\]') || verified.parentNode.parentNode;
    var editDiv = document.createElement('div');
    editDiv.id='cm-profile-name-edit';
    editDiv.style.cssText='margin-top:12px;background:#0a0e13;border:1px solid #222831;border-radius:12px;padding:12px';
    editDiv.innerHTML='<div style="font-size:12px;font-weight:bold;margin-bottom:6px">Full Name (Profile)</div><div style="display:flex;gap:8px"><input id="cm-profile-name" value="'+(name||'')+'" placeholder="Full Name" style="flex:1;background:#0a0e13;border:1px solid #333;color:#fff;padding:10px;border-radius:10px"><button id="cm-save-name" style="background:#FCD535;color:#000;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Save</button></div><div style="font-size:11px;color:#8b949e;margin-top:6px">Name Firebase me save hoga aur Profile me dikhega.</div>';
    card.parentNode.insertBefore(editDiv, card.nextSibling);
    document.getElementById('cm-save-name').addEventListener('click', async function(){
      var newName=document.getElementById('cm-profile-name').value.trim();
      if(!newName) return alert('Name likho');
      try{
        // Firestore PATCH via REST
        var url='https://firestore.googleapis.com/v1/projects/cloudminer-pro/databases/(default)/documents/users/'+encodeURIComponent(uid)+'?key=AIzaSyBjpydjZr22BAL_XuCp3p9_UVqQbvDuI6g&updateMask.fieldPaths=name';
        var body={fields:{name:{stringValue:newName}}};
        var h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token;
        var r=await fetch(url,{method:'PATCH',headers:h,body:JSON.stringify(body)});
        if(!r.ok) throw new Error(await r.text());
        window.__userName=newName; try{localStorage.setItem('cm_display_name',newName)}catch(e){}
        alert('Name saved — Firebase me save ho gaya');
        location.reload();
      }catch(e){ alert('Save failed: '+e.message); }
    });
  }
  // Observers
  setInterval(function(){ injectName(); toggleName(); }, 800);
  setInterval(loadName, 3000);
  // Restore display name from storage immediately
  try{ var dn=localStorage.getItem('cm_display_name'); if(dn) window.__userName=dn; }catch(e){}
  try{ var sn=localStorage.getItem('cm_signup_name'); if(sn) window.__signupName=sn; }catch(e){}
})();
</script>
<script>
(function(){
  const API_KEY='AIzaSyBjpydjZr22BAL_XuCp3p9_UVqQbvDuI6g';
  const PROJECT='cloudminer-pro';
  const style='background:#101720;border:1px solid #293545;border-radius:16px;padding:16px;margin-top:14px;color:#eef3f8;font-family:inherit;';
  let lastUid='',lastStatusAt=0;
  async function getSession(){
    const uid=localStorage.getItem('cloudminer_uid')||'';
    const refreshToken=localStorage.getItem('cloudminer_refresh_token')||'';
    if(!uid||!refreshToken) return null;
    const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:refreshToken});
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!r.ok) throw new Error('Session refresh failed. Please sign in again.');
    const d=await r.json();
    if(d.refresh_token) localStorage.setItem('cloudminer_refresh_token',d.refresh_token);
    return {uid,token:d.id_token};
  }
  function fields(obj){return Object.entries(obj).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&')}
  async function readKyc(session){
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users/${encodeURIComponent(session.uid)}?key=${API_KEY}`;
    const r=await fetch(url,{headers:{Authorization:'Bearer '+session.token}});
    if(!r.ok) throw new Error('Could not load KYC status.');
    const d=await r.json(), f=d.fields||{}, k=f.kyc?.mapValue?.fields||{};
    return {status:k.status?.stringValue||'not_submitted',legalName:k.legalName?.stringValue||'',cnic:k.cnic?.stringValue||'',reviewNote:k.reviewNote?.stringValue||''};
  }
  function val(v){return {stringValue:String(v||'')}}
  async function writeKyc(session,legalName,cnic){
    const kyc={legalName:val(legalName),cnic:val(cnic),status:val('pending'),submittedAt:{timestampValue:new Date().toISOString()},reviewNote:val('')};
    const url=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/users/${encodeURIComponent(session.uid)}?key=${API_KEY}&updateMask.fieldPaths=kyc`;
    const r=await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+session.token,'Content-Type':'application/json'},body:JSON.stringify({fields:{kyc:{mapValue:{fields:kyc}}}})});
    if(!r.ok) throw new Error('Submission failed. Firebase permission rules may need updating.');
  }
  function addKycCard(){
    const verified=Array.from(document.querySelectorAll('div')).find(d=>d.textContent?.trim()==='CloudMiner Member');
    if(!verified) return;
    const card=verified.closest('div.rounded-\\[20px\\]')||verified.parentElement?.parentElement;
    if(!card||document.getElementById('cm-kyc-card')) return;
    const box=document.createElement('section');box.id='cm-kyc-card';box.style.cssText=style;
    box.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><div style="font-size:15px;font-weight:800">Identity verification (KYC)</div><div style="font-size:11px;color:#9aa9b8;margin-top:4px">Submit your legal name and 13-digit CNIC for admin review.</div></div><span id="cm-kyc-status" style="font-size:11px;font-weight:800;padding:6px 9px;border-radius:20px;background:#273342;color:#dce6ef">Loading</span></div>
    <div id="cm-kyc-form" style="margin-top:14px;display:grid;gap:10px"><label style="font-size:11px;color:#aebdcb">Legal name<input id="cm-kyc-name" autocomplete="name" maxlength="100" placeholder="Name as printed on CNIC" style="display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #35465a;background:#0a1119;color:white"></label><label style="font-size:11px;color:#aebdcb">CNIC number<input id="cm-kyc-cnic" inputmode="numeric" maxlength="13" placeholder="13 digit CNIC, numbers only" style="display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #35465a;background:#0a1119;color:white"></label><label style="display:flex;gap:8px;align-items:flex-start;font-size:11px;color:#aebdcb"><input id="cm-kyc-consent" type="checkbox" style="margin-top:2px"> I consent to submitting this CNIC information for identity verification and understand it will be visible to authorized administrators.</label><button id="cm-kyc-submit" style="border:0;border-radius:10px;background:#fcd535;color:#111;padding:12px;font-weight:800">Submit for verification</button><div id="cm-kyc-msg" style="font-size:11px;color:#9aa9b8"></div></div>
    <div style="font-size:10px;color:#8292a3;margin-top:12px;line-height:1.5">Only submit your own correct details. Do not share your CNIC outside this secure account. Verification is pending until an administrator reviews it.</div>`;
    card.parentNode.insertBefore(box,card.nextSibling);
    document.getElementById('cm-kyc-submit').addEventListener('click',async()=>{
      const btn=document.getElementById('cm-kyc-submit'),msg=document.getElementById('cm-kyc-msg');
      const name=document.getElementById('cm-kyc-name').value.trim(),cnic=document.getElementById('cm-kyc-cnic').value.replace(/\D/g,'');
      if(name.length<3){msg.textContent='Enter your full legal name.';return}
      if(!/^\d{13}$/.test(cnic)){msg.textContent='CNIC must contain exactly 13 digits.';return}
      if(!document.getElementById('cm-kyc-consent').checked){msg.textContent='Please provide consent before submitting.';return}
      btn.disabled=true;btn.textContent='Submitting…';
      try{const session=await getSession();if(!session)throw new Error('Please sign in again.');await writeKyc(session,name,cnic);msg.textContent='KYC submitted successfully. Waiting for admin review.';document.getElementById('cm-kyc-status').textContent='Pending';document.getElementById('cm-kyc-status').style.background='#493a1a';document.getElementById('cm-kyc-status').style.color='#ffd76a';document.getElementById('cm-kyc-form').style.display='none';}
      catch(e){msg.textContent=e.message||'Could not submit KYC.';btn.disabled=false;btn.textContent='Submit for verification'}
    });
  }
  async function refreshKyc(){
    try{
      const session=await getSession();if(!session)return;
      const hasStatus=!!document.getElementById('cm-kyc-status');
      if(!hasStatus)return;
      if(session.uid===lastUid&&Date.now()-lastStatusAt<8000)return;
      lastUid=session.uid;lastStatusAt=Date.now();
      const k=await readKyc(session);
      const status=document.getElementById('cm-kyc-status');
      if(status){status.textContent=k.status==='approved'?'Verified':k.status==='rejected'?'Rejected':k.status==='pending'?'Pending':'Not submitted';status.style.background=k.status==='approved'?'#123d2d':k.status==='rejected'?'#482323':'#493a1a';status.style.color=k.status==='approved'?'#62e6a3':k.status==='rejected'?'#ff9292':'#ffd76a';}
      const form=document.getElementById('cm-kyc-form');
      if(form&&k.status!=='not_submitted'){form.style.display='none';const msg=document.getElementById('cm-kyc-msg');if(msg)msg.textContent=k.status==='approved'?'Your identity has been verified.':k.status==='rejected'?'Your submission was rejected. Please contact support.':'Your submission is under review.';}
      if(k.status==='approved'&&!document.getElementById('cm-identity-verified')){const badge=document.createElement('span');badge.id='cm-identity-verified';badge.textContent='✓ Identity Verified';badge.style.cssText='display:inline-block;margin-top:6px;padding:5px 9px;border-radius:20px;background:#123d2d;color:#62e6a3;font-size:10px;font-weight:800';document.getElementById('cm-kyc-card')?.prepend(badge);}
    }catch(e){/* keep profile usable if KYC status is temporarily unavailable */}
  }
  setInterval(()=>{addKycCard();refreshKyc()},1200);
})();
</script>
