<script>
(function(){
  window.__signupName=""; window.__userName="";
  // --- Inject Name input in Create Account form ---
  function injectName(){
    // Find signup form: inputs with placeholder Email address - the one inside auth page
    var inputs = Array.from(document.querySelectorAll('input[placeholder="Email address"]'));
    // Only inject once
    if(document.getElementById('cm-name-input')) return;
    var emailInput = inputs[0];
    if(!emailInput) return;
    // Check if we are in signup mode: button text Create Account exists and is active? We inject always, but hide in login mode via observer of tab
    // We will inject and toggle visibility based on Create Account button active state
    var wrap = emailInput.closest('div.relative');
    if(!wrap) return;
    var div = document.createElement('div');
    div.id='cm-name-wrap';
    div.className='relative group';
    div.innerHTML = '<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px">👤</span><input id="cm-name-input" placeholder="Full Name" autocomplete="name" style="width:100%;height:46px;padding-left:40px;padding-right:12px;background:#0a0e13;border:1px solid #2a2e35;border-radius:12px;color:#fff;font-size:14px;outline:none" />';
    wrap.parentNode.insertBefore(div, wrap);
    var inp = document.getElementById('cm-name-input');
    inp.addEventListener('input', function(){ window.__signupName = this.value.trim(); try{localStorage.setItem('cm_signup_name', this.value)}catch(e){} });
    // Restore
    try{ var saved=localStorage.getItem('cm_signup_name'); if(saved){ inp.value=saved; window.__signupName=saved; } }catch(e){}
    // Also hook signup button: if signup and name empty, block and alert
    document.addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if(btn && btn.textContent && btn.textContent.trim()==='Create Account'){
        var nameVal = document.getElementById('cm-name-input') ? document.getElementById('cm-name-input').value.trim() : window.__signupName;
        if(!nameVal){
          // Only block if we are in signup mode (Confirm Password visible)
          var hasConfirm = !!Array.from(document.querySelectorAll('input[placeholder="Confirm Password"]')).length;
          if(hasConfirm){ e.preventDefault(); e.stopPropagation(); alert('Please enter your Full Name'); return false; }
        } else { window.__signupName=nameVal; }
      }
    }, true);
  }
  // Toggle name visibility: show only when Confirm Password exists (signup mode), hide in login mode
  function toggleName(){
    var wrap=document.getElementById('cm-name-wrap');
    if(!wrap) return;
    var isSignup = !!document.querySelector('input[placeholder="Confirm Password"]');
    wrap.style.display = isSignup ? 'block' : 'none';
  }
  // --- Load name from Firestore for profile ---
  async function loadName(){
    try{
      // Find uid + token from localStorage (app stores as cloudminer... or similar)
      var uid=null, token=null;
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); var v=localStorage.getItem(k)||""; try{ var j=JSON.parse(v); if(j && j.uid){ uid=j.uid; token=j.idToken||j.token||j.accessToken; } if(j && j.localId){ uid=j.localId; token=j.idToken; } }catch(e){} if(v && v.indexOf('cloudminer')!==-1){} }
      // Fallback: try to read from app's stored keys - check all keys for uid pattern
      if(!uid){
        var keys=Object.keys(localStorage);
        for(var k of keys){ try{ var vv=JSON.parse(localStorage.getItem(k)); if(vv && vv.uid) uid=vv.uid; }catch(e){} }
      }
      if(!uid) return;
      // Try Firestore REST via fetch with token if available, else without (rules allow if authenticated, but try public)
      var url='https://firestore.googleapis.com/v1/projects/cloudminer-pro/databases/(default)/documents/users/'+encodeURIComponent(uid)+'?key=AIzaSyBjpydjZr22BAL_XuCp3p9_UVqQbvDuI6g';
      var headers={};
      if(token) headers['Authorization']='Bearer '+token;
      var res=await fetch(url,{headers:headers});
      if(!res.ok) return;
      var data=await res.json();
      var fields=data.fields||{};
      var name = fields.name && fields.name.stringValue ? fields.name.stringValue : "";
      if(name){ window.__userName=name; try{localStorage.setItem('cm_display_name', name)}catch(e){} }
      // Also inject Name row + Edit in Profile page if visible
      injectProfileEdit(uid, token, name);
    }catch(e){}
  }
  function injectProfileEdit(uid, token, name){
    // Profile page: find "Verified Miner" element
    var verified = Array.from(document.querySelectorAll('div')).find(d=>d.textContent && d.textContent.trim()==='Verified Miner • Level 2');
    if(!verified) return;
    if(document.getElementById('cm-profile-name-edit')) return;
    var card = verified.closest('div.rounded-\\[20px\\]') || verified.parentNode.parentNode;
    var editDiv = document.createElement('div');
    editDiv.id='cm-profile-name-edit';
    editDiv.style.cssText='margin-top:12px;background:#0a0e13;border:1px solid #222831;border-radius:12px;padding:12px';
    editDiv.innerHTML='<div style="font-size:12px;font-weight:bold;margin-bottom:6px">Full Name (Profile)</div><div style="display:flex;gap:8px"><input id="cm-profile-name" value="'+(name||'')+'" placeholder="Full Name" style="flex:1;background:#0a0e13;border:1px solid #333;color:#fff;padding:10px;border-radius:10px"><button id="cm-save-name" style="background:#FCD535;color:#000;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Save</button></div><div style="font-size:11px;color:#8b949e;margin-top:6px">Name Firebase me save hoga aur Profile me dikhega.</div>';
    card.parentNode.insertBefore(editDiv, card.nextSibling);
    document.getElementById('cm-save-name').addEventListener('click', async function(){
      var newName=document.getElementById('cm-profile-name').value.trim();
      if(!newName) return alert('Name likho');
      try{
        // Firestore PATCH via REST
        var url='https://firestore.googleapis.com/v1/projects/cloudminer-pro/databases/(default)/documents/users/'+encodeURIComponent(uid)+'?key=AIzaSyBjpydjZr22BAL_XuCp3p9_UVqQbvDuI6g&updateMask.fieldPaths=name';
        var body={fields:{name:{stringValue:newName}}};
        var h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token;
        var r=await fetch(url,{method:'PATCH',headers:h,body:JSON.stringify(body)});
        if(!r.ok) throw new Error(await r.text());
        window.__userName=newName; try{localStorage.setItem('cm_display_name',newName)}catch(e){}
        alert('Name saved — Firebase me save ho gaya');
        location.reload();
      }catch(e){ alert('Save failed: '+e.message); }
    });
  }
  // Observers
  setInterval(function(){ injectName(); toggleName(); }, 400);
  setInterval(loadName, 1200);
  // Restore display name from storage immediately
  try{ var dn=localStorage.getItem('cm_display_name'); if(dn) window.__userName=dn; }catch(e){}
  try{ var sn=localStorage.getItem('cm_signup_name'); if(sn) window.__signupName=sn; }catch(e){}
})();
</script>

      + '<button id="cm-confirm" style="flex:1;height:46px;border-radius:999px;border:none;background:#FCD535;color:#000;font-weight:800;font-size:14px;cursor:pointer">Confirm</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(overlay);
    function done(v){ overlay.remove(); resolve(v); }

    overlay.onclick = function(e){ if(e.target===overlay) done(false); };
  });
};

  };

  function findAuth() {
    uid = null; token = null;
    try {
      // The app stores these values as individual strings, rather than as one
      // JSON object. Read them first so a signed-in user is recognised.
      uid = localStorage.getItem("cloudminer_uid") || null;
      token = localStorage.getItem("cloudminer_id_token") || null;
      for (let i = 0; i < localStorage.length; i++) {
        const value = localStorage.getItem(localStorage.key(i)) || "";
        try {
          const item = JSON.parse(value);
          if (item && (item.uid || item.localId)) {
            uid = item.uid || item.localId;
            token = item.idToken || item.token || item.accessToken || token;
          }
          if (item && item.stsTokenManager && item.stsTokenManager.accessToken) {
            token = item.stsTokenManager.accessToken;
            uid = uid || item.uid;
          }
        } catch (_) {}
      }
    } catch (_) {}
    return Boolean(uid);
  }

  async function ensureAuth() {
    findAuth();
    if (!uid) return false;
    try {
      const refreshToken = localStorage.getItem("cloudminer_refresh_token");
      if (refreshToken) {
        const response = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken })
        });
        if (!response.ok) throw new Error("Session refresh failed");
        const session = await response.json();
        token = session.id_token || token;
        uid = session.user_id || uid;
        if (token) localStorage.setItem("cloudminer_id_token", token);
      }
    } catch (_) {
      // A usable in-memory token can still complete the request. The submit
      // flow shows a clear card if there is no valid session at all.
    }
    return Boolean(uid && token);
  }

  async function getUser() {
    if (!await ensureAuth()) return null;
    const response = await fetch(`${base()}/users/${encodeURIComponent(uid)}?key=${API_KEY}`, { headers: headers() });
    if (!response.ok) return null;
    const data = await response.json();
    const fields = data.fields || {};
    const kyc = fields.kyc && fields.kyc.mapValue && fields.kyc.mapValue.fields || {};
    const status = kyc.status && kyc.status.stringValue || "";
    // KYC approval is the authoritative state. Some existing admin records do
    // not have a separate isVerified flag, so the blue tick must follow the
    // approved KYC status itself.
    approved = status === "approved";
    userDoc = { status, legalName: kyc.legalName?.stringValue || "", cnic: kyc.cnic?.stringValue || "" };
    return userDoc;
  }

  function profileElements() {
    const label = Array.from(document.querySelectorAll("span,div")).find(el =>
      el.children.length === 0 && (el.textContent || "").trim() === "Verified Miner • Level 2");
    if (!label) return null;
    let root = label;
    for (let i = 0; i < 8 && root.parentElement; i++) {
      root = root.parentElement;
      if ((root.className || "").toString().includes("space-y-4")) break;
    }
    return { label, root };
  }

  function applyVerificationVisibility() {
    const tickDef = document.querySelector("#cmMetaTick");
    const originalTick = tickDef && tickDef.closest("svg");
    // Replace the old grey tick with a Meta-style blue verified badge.
    if (originalTick) originalTick.style.display = "none";
    const tickHost = originalTick && originalTick.parentElement;
    if (tickHost) {
      let metaTick = tickHost.querySelector("#cm-meta-blue-tick");
      if (!metaTick) {
        metaTick = document.createElement("span");
        metaTick.id = "cm-meta-blue-tick";
        metaTick.title = "Verified";
        metaTick.style.cssText = "display:inline-flex;width:21px;height:21px;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle";
        metaTick.innerHTML = `<svg viewBox="0 0 24 24" width="21" height="21" aria-label="Verified account" role="img"><path fill="#0095F6" d="M22 12c0 1.43-1.35 2.45-1.78 3.68-.45 1.28-.11 2.91-.94 3.98-.84 1.08-2.5 1.07-3.63 1.86-1.09.76-1.74 2.29-3.08 2.29s-1.99-1.53-3.08-2.29c-1.13-.79-2.79-.78-3.63-1.86-.83-1.07-.49-2.7-.94-3.98C4.35 14.45 3 13.43 3 12s1.35-2.45 1.78-3.68c.45-1.28.11-2.91.94-3.98.84-1.08 2.5-1.07 3.63-1.86C10.44 1.72 11.09.19 12.43.19s1.99 1.53 3.08 2.29c1.13.79 2.79.78 3.63 1.86.83 1.07.49 2.7.94 3.98C20.65 9.55 22 10.57 22 12z"/><path fill="#fff" d="m10.45 15.6-3.02-3.02 1.34-1.34 1.68 1.68 4.9-4.9 1.34 1.34-6.24 6.24z"/></svg>`;
        tickHost.insertBefore(metaTick, originalTick);
      }
      metaTick.style.display = approved ? "inline-flex" : "none";
      const official = Array.from(tickHost.children).find(el =>
        el !== originalTick && el !== metaTick && (el.textContent || "").trim() === "OFFICIAL");
      if (official) official.style.display = approved ? "" : "none";
    }
    const els = Array.from(document.querySelectorAll("span,div")).filter(el =>
      el.children.length === 0 && (el.textContent || "").trim() === "Verified Miner • Level 2");
    els.forEach(el => { el.style.display = approved ? "" : "none"; });
  }

  function card(title, subtitle) {
    const el = document.createElement("section");
    el.style.cssText = "background:#151a21;border:1px solid #232a34;border-radius:16px;padding:16px;color:#fff";
    el.innerHTML = `<div style="font-size:13px;font-weight:800;margin-bottom:5px">${esc(title)}</div>` +
      `<div style="font-size:11px;color:#8b949e;line-height:1.5;margin-bottom:12px">${esc(subtitle)}</div>`;
    return el;
  }

  function closeKycDialog() {
    document.getElementById("cm-kyc-dialog")?.remove();
  }

  function showKycMessage(title, message, tone) {
    closeKycDialog();
    const accent = tone === "success" ? "#22c55e" : tone === "error" ? "#ef4444" : "#FCD535";
    const overlay = document.createElement("div");
    overlay.id = "cm-kyc-dialog";
    overlay.style.cssText = "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.76);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px";
    overlay.innerHTML = `<div role="dialog" aria-modal="true" style="width:100%;max-width:360px;background:#151a21;border:1px solid ${accent};border-radius:20px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)">` +
      `<div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${accent};color:#0a0e13;font-size:22px;font-weight:900;margin-bottom:14px">${tone === "success" ? "✓" : tone === "error" ? "!" : "i"}</div>` +
      `<div style="font-size:17px;font-weight:800;color:#fff">${esc(title)}</div>` +
      `<div style="font-size:13px;color:#cbd5e1;line-height:1.55;margin-top:8px">${esc(message)}</div>` +
      `<button id="cm-kyc-dialog-close" style="width:100%;height:46px;border:0;border-radius:999px;background:${accent};color:#0a0e13;font-size:14px;font-weight:800;margin-top:18px;cursor:pointer">OK</button>` +
      `</div>`;
    document.body.appendChild(overlay);
    const done = () => closeKycDialog();
    overlay.querySelector("#cm-kyc-dialog-close").onclick = done;
    overlay.onclick = event => { if (event.target === overlay) done(); };
  }

  function showKycConfirmation(legalName, cnic) {
    return new Promise(resolve => {
      closeKycDialog();
      const overlay = document.createElement("div");
      overlay.id = "cm-kyc-dialog";
      overlay.style.cssText = "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.76);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px";
      const maskedCnic = cnic.slice(0, 5) + "•••••" + cnic.slice(-3);
      overlay.innerHTML = `<div role="dialog" aria-modal="true" style="width:100%;max-width:360px;background:#151a21;border:1px solid rgba(252,213,53,.55);border-radius:20px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)">` +
        `<div style="width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FCD535;color:#0a0e13;font-size:24px;margin-bottom:14px">🪪</div>` +
        `<div style="font-size:17px;font-weight:800;color:#fff">Confirm KYC submission?</div>` +
        `<div style="font-size:13px;color:#cbd5e1;line-height:1.55;margin-top:7px">Please check your details before sending them for admin review.</div>` +
        `<div style="background:#0a0e13;border:1px solid #2a2e35;border-radius:13px;padding:12px;margin-top:15px;font-size:12px;line-height:1.7">` +
          `<div style="color:#8b949e">Legal name</div><div style="color:#fff;font-weight:700">${esc(legalName)}</div>` +
          `<div style="color:#8b949e;margin-top:7px">CNIC number</div><div style="color:#fff;font-weight:700">${esc(maskedCnic)}</div>` +
        `</div>` +
        `<div style="display:flex;gap:10px;margin-top:18px"><button id="cm-kyc-cancel" style="flex:1;height:46px;border:1px solid #2a2e35;border-radius:999px;background:#0a0e13;color:#fff;font-size:14px;font-weight:700;cursor:pointer">Cancel</button><button id="cm-kyc-confirm" style="flex:1;height:46px;border:0;border-radius:999px;background:#FCD535;color:#0a0e13;font-size:14px;font-weight:800;cursor:pointer">Confirm</button></div>` +
        `</div>`;
      document.body.appendChild(overlay);
      const done = answer => { closeKycDialog(); resolve(answer); };
      overlay.querySelector("#cm-kyc-cancel").onclick = () => done(false);
      overlay.querySelector("#cm-kyc-confirm").onclick = () => done(true);
      overlay.onclick = event => { if (event.target === overlay) done(false); };
    });
  }

  function renderKyc(container) {
    const box = card("🪪 KYC Verification", "Submit your legal name and CNIC. Your verification badge will appear only after admin approval.");
    const status = userDoc?.status || "";
    const statusColor = status === "approved" ? "#22c55e" : status === "pending" ? "#FCD535" : "#8b949e";
    if (status) {
      const state = document.createElement("div");
      state.style.cssText = `font-size:12px;font-weight:800;color:${statusColor};margin-bottom:12px`;
      state.textContent = "Status: " + status.toUpperCase();
      box.appendChild(state);
    }
    if (status !== "approved" && status !== "pending") {
      const form = document.createElement("form");
      form.innerHTML =
        `<label style="display:block;font-size:11px;color:#cbd5e1;margin-bottom:5px">Legal name</label>` +
        `<input id="cm-kyc-name" autocomplete="name" value="${esc(userDoc?.legalName || "")}" placeholder="Enter your legal name" required style="width:100%;box-sizing:border-box;background:#0a0e13;border:1px solid #333;color:#fff;border-radius:10px;padding:11px;margin-bottom:10px">` +
        `<label style="display:block;font-size:11px;color:#cbd5e1;margin-bottom:5px">CNIC number</label>` +
        `<input id="cm-kyc-cnic" inputmode="numeric" autocomplete="off" value="${esc(userDoc?.cnic || "")}" placeholder="13 digit CNIC number" maxlength="15" required style="width:100%;box-sizing:border-box;background:#0a0e13;border:1px solid #333;color:#fff;border-radius:10px;padding:11px;margin-bottom:12px">` +
        `<button type="submit" style="width:100%;background:#FCD535;color:#000;border:0;border-radius:10px;padding:12px;font-weight:800">Submit KYC</button>`;
      form.addEventListener("submit", submitKyc);
      box.appendChild(form);
    } else if (status === "pending") {
      const note = document.createElement("div");
      note.style.cssText = "font-size:12px;color:#cbd5e1";
      note.textContent = "Your KYC is waiting for admin review.";
      box.appendChild(note);
    } else {
      const note = document.createElement("div");
      note.style.cssText = "font-size:12px;color:#22c55e";
      note.textContent = "Your KYC has been approved. Your verification badge is active.";
      box.appendChild(note);
    }
    container.appendChild(box);
  }

  async function submitKyc(event) {
    event.preventDefault();
    if (busy) return;
    const legalName = document.getElementById("cm-kyc-name")?.value.trim() || "";
    const cnic = (document.getElementById("cm-kyc-cnic")?.value || "").replace(/\D/g, "");
    if (!legalName) return showKycMessage("Legal name required", "Please enter your legal name before submitting KYC.", "error");
    if (!/^\d{13}$/.test(cnic)) return showKycMessage("Valid CNIC required", "Please enter a valid 13-digit CNIC number.", "error");
    if (!await ensureAuth()) {
      showKycMessage("Session unavailable", "Your login session could not be restored. Please sign in again, then retry KYC.", "error");
      return;
    }
    const confirmed = await showKycConfirmation(legalName, cnic);
    if (!confirmed) return;
    busy = true;
    try {
      const payload = {
        fields: {
          kyc: { mapValue: { fields: {
            legalName: { stringValue: legalName },
            cnic: { stringValue: cnic },
            status: { stringValue: "pending" },
            submittedAt: { timestampValue: new Date().toISOString() }
          }}}
        }
      };
      const url = `${base()}/users/${encodeURIComponent(uid)}?key=${API_KEY}&updateMask.fieldPaths=kyc`;
      const response = await fetch(url, { method: "PATCH", headers: headers(), body: JSON.stringify(payload) });
      if (!response.ok) throw new Error(await response.text());
      userDoc = { status: "pending", legalName, cnic };
      approved = false;
      applyVerificationVisibility();
      const info = profileElements();
      if (info) {
        const old = document.getElementById("cm-profile-extras");
        if (old) old.remove();
        injectProfileExtras(info.root);
      }
      showKycMessage("KYC submitted", "Your KYC has been sent for admin review. Your verification badge will appear after approval.", "success");
    } catch (error) {
      const detail = String(error?.message || "");
      const message = /permission|unauthenticated|401|403/i.test(detail)
        ? "Your session expired or does not have permission. Please sign in again and retry."
        : "KYC could not be submitted right now. Please check your connection and try again.";
      showKycMessage("KYC submission failed", message, "error");
    } finally {
      busy = false;
    }
  }

  function formatDate(value) {
    if (!value) return "";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
  }

  function notificationRows() {
    if (!notificationDocs.length) {
      return `<div style="font-size:12px;color:#8b949e;text-align:center;padding:18px 4px">No notifications yet.</div>`;
    }
    return notificationDocs.map(n =>
      `<div style="padding:12px 0;border-top:1px solid #232a34">` +
      `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center">` +
      `<div style="font-size:12px;font-weight:800;color:#fff">${esc(n.title)}</div>` +
      `${n.read ? "" : `<span style="font-size:9px;color:#FCD535;font-weight:800">NEW</span>`}</div>` +
      `<div style="font-size:11px;color:#cbd5e1;line-height:1.5;margin-top:5px;white-space:pre-wrap">${esc(n.message)}</div>` +
      `<div style="font-size:9px;color:#687585;margin-top:5px">${esc(formatDate(n.createdAt))}</div></div>`
    ).join("");
  }

  function renderNotificationList() {
    const list = document.getElementById("cm-notification-list");
    if (list) list.innerHTML = notificationRows();
  }

  function updateNotificationBell() {
    const button = document.getElementById("cm-notification-bell");
    const badge = document.getElementById("cm-notification-badge");
    const unread = notificationDocs.filter(item => !item.read).length;
    if (badge) {
      badge.textContent = unread > 9 ? "9+" : String(unread);
      badge.style.display = unread ? "flex" : "none";
    }
    if (button) button.setAttribute("aria-label", unread ? `${unread} unread notifications` : "Notifications");
  }

  function locallyReadNotificationIds() {
    try {
      const saved = JSON.parse(localStorage.getItem(`cm_read_notifications_${uid}`) || "[]");
      return new Set(Array.isArray(saved) ? saved : []);
    } catch (_) {
      return new Set();
    }
  }

  function rememberReadNotifications(items) {
    try {
      const seen = locallyReadNotificationIds();
      items.forEach(item => seen.add(item.id));
      localStorage.setItem(`cm_read_notifications_${uid}`, JSON.stringify(Array.from(seen).slice(-200)));
    } catch (_) {}
  }

  async function markNotificationsRead() {
    const unread = notificationDocs.filter(item => !item.read);
    if (!unread.length) return;
    // Clear the badge immediately when the bell is opened, then persist the
    // read state in Firestore. Local storage preserves the cleared state if a
    // temporary network issue prevents that write.
    unread.forEach(item => { item.read = true; });
    rememberReadNotifications(unread);
    renderNotificationList();
    updateNotificationBell();
    if (!await ensureAuth()) return;
    await Promise.allSettled(unread.map(item => fetch(
      `${base()}/users/${encodeURIComponent(uid)}/notifications/${encodeURIComponent(item.id)}?key=${API_KEY}&updateMask.fieldPaths=read`,
      { method: "PATCH", headers: headers(), body: JSON.stringify({ fields: { read: { booleanValue: true } } }) }
    )));
  }

  function openNotificationPanel() {
    document.getElementById("cm-notification-panel")?.remove();
    const overlay = document.createElement("div");
    overlay.id = "cm-notification-panel";
    overlay.style.cssText = "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.76);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px";
    overlay.innerHTML = `<div role="dialog" aria-modal="true" style="width:100%;max-width:370px;max-height:78vh;display:flex;flex-direction:column;background:#151a21;border:1px solid #2a2e35;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)">` +
      `<div style="display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #232a34"><div><div style="font-size:16px;font-weight:800;color:#fff">🔔 Notifications</div><div style="font-size:11px;color:#8b949e;margin-top:3px">Messages from the admin</div></div><button id="cm-notification-close" aria-label="Close notifications" style="width:32px;height:32px;border-radius:50%;border:1px solid #2a2e35;background:#0a0e13;color:#fff;font-size:18px;cursor:pointer">×</button></div>` +
      `<div id="cm-notification-list" style="overflow-y:auto;padding:0 16px 14px"><div style="font-size:12px;color:#8b949e;text-align:center;padding:18px 4px">Loading notifications…</div></div>` +
      `</div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#cm-notification-close").onclick = () => overlay.remove();
    overlay.onclick = event => { if (event.target === overlay) overlay.remove(); };
    renderNotificationList();
    markNotificationsRead();
    loadNotifications(true);
  }

  function installNotificationBell() {
    if (document.getElementById("cm-notification-bell")) return;
    const header = Array.from(document.querySelectorAll("div.sticky")).find(element =>
      (element.textContent || "").includes("CloudMiner") && (element.textContent || "").includes("BALANCE"));
    if (!header) return;
    const rightSide = Array.from(header.children).find(child => (child.textContent || "").includes("BALANCE"));
    if (!rightSide) return;
    const button = document.createElement("button");
    button.id = "cm-notification-bell";
    button.type = "button";
    button.style.cssText = "position:relative;width:34px;height:34px;border:1px solid #2a2e35;border-radius:50%;background:#151a21;color:#FCD535;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer";
    button.innerHTML = `<span aria-hidden="true">🔔</span><span id="cm-notification-badge" style="position:absolute;top:-5px;right:-6px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center">0</span>`;
    button.onclick = openNotificationPanel;
    rightSide.prepend(button);
    updateNotificationBell();
  }

  async function loadNotifications(markReadAfterLoad = false) {
    if (!await ensureAuth()) return;
    try {
      const response = await fetch(`${base()}/users/${encodeURIComponent(uid)}/notifications?pageSize=50&key=${API_KEY}`, { headers: headers() });
      if (!response.ok) throw new Error("Notification request failed");
      const data = await response.json();
      const locallyRead = locallyReadNotificationIds();
      notificationDocs = (data.documents || []).map(doc => {
        const fields = doc.fields || {};
        const id = doc.name.split("/").pop();
        return {
          id,
          title: fields.title?.stringValue || "Notification",
          message: fields.message?.stringValue || "",
          createdAt: fields.createdAt?.timestampValue || "",
          read: fields.read?.booleanValue === true || locallyRead.has(id)
        };
      }).sort((left, right) => new Date(right.createdAt || 0) - new Date(left.createdAt || 0));
      renderNotificationList();
      updateNotificationBell();
      if (markReadAfterLoad) await markNotificationsRead();
    } catch (_) {
      const list = document.getElementById("cm-notification-list");
      if (list) list.innerHTML = `<div style="font-size:12px;color:#ef4444;text-align:center;padding:18px 4px">Notifications could not be loaded. Please try again.</div>`;
    } finally {
      lastNotificationFetch = Date.now();
    }
  }

  function injectProfileExtras(root) {
    if (!root || document.getElementById("cm-profile-extras")) return;
    profileRoot = root;
    const extras = document.createElement("div");
    extras.id = "cm-profile-extras";
    extras.style.cssText = "display:flex;flex-direction:column;gap:12px;margin-bottom:12px";
    renderKyc(extras);
    const profileCard = Array.from(root.children).find(child =>
      (child.textContent || "").includes("Verified Miner • Level 2"));
    const nameEditor = document.getElementById("cm-profile-name-edit");
    const after = nameEditor?.parentElement === root ? nameEditor : profileCard;
    if (after?.nextSibling) root.insertBefore(extras, after.nextSibling);
    else if (after) root.appendChild(extras);
    else root.insertBefore(extras, root.firstChild);
  }

  async function refreshProfileData() {
    installNotificationBell();
    if (Date.now() - lastNotificationFetch > 20000) loadNotifications();
    const info = profileElements();
    if (!info) {
      applyVerificationVisibility();
      return;
    }
    if (!uid || !userDoc) {
      await getUser();
    }
    applyVerificationVisibility();
    if (!document.getElementById("cm-profile-extras")) injectProfileExtras(info.root);
  }

  // Hide the pre-existing verification mark until the admin-approved Firestore
  // status has been confirmed. Existing app screens and unrelated features stay intact.
  const style = document.createElement("style");
  style.textContent = "#cmMetaTick{display:none} ";
  document.head.appendChild(style);
  setInterval(() => {
    applyVerificationVisibility();
    refreshProfileData();
  }, 1500);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { userDoc = null; refreshProfileData(); }
  });
})();
</script>

<script>
(function () {
  const steps = [
    ["01", "Deposit Funds", "Add USDT (TRC20) or Binance Pay to your wallet."],
    ["02", "Choose a Miner", "Pick a plan from $100 to $2000. 15-day contract."],
    ["03", "Claim Daily", "Claim your daily profit every 24 hours from Plans."],
    ["04", "Withdraw Earnings", "After 15 days, principal returns + withdraw anytime."]
  ];

  function findHowItWorksCard() {
    const heading = Array.from(document.querySelectorAll("h1,h2,h3,h4,div,span")).find(element =>
      element.children.length === 0 && (element.textContent || "").trim() === "How It Works");
    if (!heading) return null;
    let card = heading.parentElement;
    while (card && card !== document.body) {
      const text = card.textContent || "";
      if (text.includes("Deposit Funds") && text.includes("Choose a Miner") && text.includes("Withdraw Earnings")) return card;
      card = card.parentElement;
    }
    return null;
  }

  function improveHowItWorks() {
    const card = findHowItWorksCard();
    if (!card || card.id === "cm-how-it-works-fixed") return;
    card.id = "cm-how-it-works-fixed";
    card.style.cssText = "background:#151a21;border:1px solid #2b3440;border-radius:20px;padding:18px;margin-top:14px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)";
    card.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div style="font-size:16px;font-weight:800;letter-spacing:-.2px">How It Works</div><span style="font-size:9px;font-weight:800;letter-spacing:.11em;color:#FCD535;border:1px solid rgba(252,213,53,.35);background:rgba(252,213,53,.09);border-radius:999px;padding:5px 8px">START HERE</span></div>` +
      `<div style="display:flex;flex-direction:column;gap:10px">${steps.map((step, index) =>
        `<div style="display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start;padding:${index === 0 ? "0 0 4px" : "8px 0 4px"}">` +
          `<div style="width:34px;height:34px;border-radius:11px;background:#FCD535;color:#0a0e13;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:900;box-shadow:0 0 0 4px rgba(252,213,53,.07)">${step[0]}</div>` +
          `<div style="min-width:0;padding-top:1px"><div style="font-size:14px;font-weight:800;color:#fff;line-height:1.25">${step[1]}</div><div style="font-size:12px;color:#8fa0b3;line-height:1.5;margin-top:4px">${step[2]}</div></div>` +
        `</div>`
      ).join("")}</div>`;
  }

  improveHowItWorks();
  setInterval(improveHowItWorks, 1200);
})();
</script>

</body>
</html>
