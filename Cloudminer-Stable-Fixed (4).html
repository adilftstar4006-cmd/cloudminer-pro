  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-200 {
  transition-duration: 200ms;
}

.ease-in {
  transition-timing-function: cubic-bezier(0.4, 0, 1, 1);
}

.ease-in-out {
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

.ease-out {
  transition-timing-function: cubic-bezier(0, 0, 0.2, 1);
}

html,
body,
#root {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/*
 * Tailwind v4's Preflight no longer sets `cursor: pointer` on buttons, so
 * clickable controls fall back to the default arrow cursor. Restore the
 * pointer cursor on interactive elements so artifacts give a clear
 * "this is clickable" affordance on hover.
 */

button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label[for],
select:not(:disabled),
summary {
  cursor: pointer;
}

.selection\:bg-\[\#FCD535\]\/30 *::-moz-selection {
  background-color: rgb(252 213 53 / 0.3);
}

.selection\:bg-\[\#FCD535\]\/30 *::selection {
  background-color: rgb(252 213 53 / 0.3);
}

.selection\:bg-\[\#FCD535\]\/30::-moz-selection {
  background-color: rgb(252 213 53 / 0.3);
}

.selection\:bg-\[\#FCD535\]\/30::selection {
  background-color: rgb(252 213 53 / 0.3);
}

.hover\:bg-\[\#ffdf5e\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(255 223 94 / var(--tw-bg-opacity, 1));
}

.hover\:bg-emerald-300:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(110 231 183 / var(--tw-bg-opacity, 1));
}

.hover\:bg-red-500\/15:hover {
  background-color: rgb(239 68 68 / 0.15);
}

.hover\:bg-white\/10:hover {
  background-color: rgb(255 255 255 / 0.1);
}

.hover\:bg-white\/15:hover {
  background-color: rgb(255 255 255 / 0.15);
}

.hover\:bg-white\/90:hover {
  background-color: rgb(255 255 255 / 0.9);
}

.hover\:bg-white\/\[0\.04\]:hover {
  background-color: rgb(255 255 255 / 0.04);
}

.focus\:border-\[\#FCD535\]\/50:focus {
  border-color: rgb(252 213 53 / 0.5);
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:gap-1\.5 {
    gap: 0.375rem;
  }

  .sm\:rounded-\[28px\] {
    border-radius: 28px;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }
}
