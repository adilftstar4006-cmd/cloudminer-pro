:root{
  --bg:#0a0e13;
  --surface:#111823;
  --surface-2:#182231;
  --line:#273244;
  --text:#f2f5f8;
  --muted:#9aa9bc;
  --accent:#FCD535;
  --accent-ink:#11120a;
  --green:#43d98a;
  --red:#ff6b6b;
  --amber:#ffb454;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.mono{
  font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#303e52;
  border-radius:99px
}

input,select,textarea{
  background:#0b1119;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  width:100%
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(252,213,53,.14)
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:640px
}

th{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:left;
  padding:13px 14px;
  border-bottom:1px solid var(--line)
}

td{
  padding:14px;
  border-bottom:1px solid #1b2533;
  font-size:14px;
  vertical-align:top
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:0;
  background:transparent;
  color:#c8d2df;
  padding:12px 13px;
  border-radius:10px;
  text-align:left
}

.nav-btn.active{
  background:#fcd535;
  color:#11120a;
  font-weight:800
}

.nav-btn:hover{
  background:#1d2a3b
}

.nav-btn.active:hover{
  background:#fcd535
}

@media(max-width:820px){
  .sidebar{
    display:none
  }

  .sidebar.open{
    display:flex;
    position:fixed;
    inset:0 auto 0 0;
    z-index:50;
    box-shadow:30px 0 80px #000
  }
}
</style>
